name: Build & Release TobeTV APK

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Create local.properties with Supabase Config
        run: |
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "supabase.anonKey=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Build Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: TobeTV ${{ github.ref_name }}
          body: |
            ## 🚀 TobeTV Release ${{ github.ref_name }}
            
            Pembaruan otomatis TobeTV untuk Android TV:
            - Kurasi 52 Channel TV Indonesia & Internasional (dilengkapi multi-server backup).
            - 25 Judul Film Bioskop Box Office (dengan kontrol putar, jeda, dan mundurkan/majukan).
            - Optimalisasi layar penuh (Stretch 16:9) & hemat memori RAM untuk TV spesifikasi rendah.
            
            ### 📥 Unduh APK:
            Langsung unduh file `app-debug.apk` di bawah ini.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Supabase app_updates Table
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_ANON_KEY }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -n 1 | awk '{print $NF}' | tr -d '"')
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-debug.apk"
          CHANGELOG="Pembaruan TobeTV ${TAG_NAME}: 52 channel TV, 25 film bioskop VOD, dan kontrol player."

          echo "Mengirim update ke Supabase..."
          curl -s -f -X POST "${SUPABASE_URL}/rest/v1/app_updates" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"version_code\": ${VERSION_CODE}, \"version_name\": \"${VERSION_NAME}\", \"apk_url\": \"${APK_URL}\", \"changelog\": \"${CHANGELOG}\", \"is_active\": true}" || echo "Periksa SUPABASE_SERVICE_ROLE_KEY di GitHub Secrets jika gagal RLS"
          echo "Selesai sinkronisasi ke Supabase."
